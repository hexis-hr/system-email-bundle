name: tests

on:
    push:
    pull_request:

jobs:
    phpunit:
        name: PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, SQLite
        runs-on: ubuntu-latest
        # The organization allows only GitHub-owned actions, so PHP comes from the official image.
        container: php:${{ matrix.php }}-cli
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.1'
                      symfony: '5.4.*'
                    - php: '8.2'
                      symfony: '6.4.*'
                    - php: '8.3'
                      symfony: '7.4.*'
                    - php: '8.4'
                      symfony: '8.*'
        env:
            COMPOSER_ALLOW_SUPERUSER: '1'
            SYMFONY_REQUIRE: ${{ matrix.symfony }}
        steps:
            - uses: actions/checkout@v4

            - name: Install Composer and Symfony Flex (pins Symfony through SYMFONY_REQUIRE)
              run: |
                  apt-get update -qq
                  apt-get install -y -qq git unzip
                  curl -fsSL https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
                  composer global config --no-plugins allow-plugins.symfony/flex true
                  composer global require --no-progress --no-scripts --no-plugins symfony/flex

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            - name: Run PHPUnit
              run: vendor/bin/phpunit

    phpunit-mysql:
        name: PHP 8.4, Symfony 8.*, MySQL 8.4
        runs-on: ubuntu-latest
        container: php:8.4-cli
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
                    MYSQL_DATABASE: system_email_bundle_test
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        env:
            COMPOSER_ALLOW_SUPERUSER: '1'
            SYMFONY_REQUIRE: '8.*'
            SYSTEM_EMAIL_TEST_DATABASE_URL: 'mysql://root@mysql:3306/system_email_bundle_test?serverVersion=8.4&charset=utf8mb4'
        steps:
            - uses: actions/checkout@v4

            - name: Install pdo_mysql, Composer and Symfony Flex (pins Symfony through SYMFONY_REQUIRE)
              run: |
                  apt-get update -qq
                  apt-get install -y -qq git unzip
                  docker-php-ext-install pdo_mysql
                  curl -fsSL https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
                  composer global config --no-plugins allow-plugins.symfony/flex true
                  composer global require --no-progress --no-scripts --no-plugins symfony/flex

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            - name: Run PHPUnit
              run: vendor/bin/phpunit

    phpunit-postgres:
        name: PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, DBAL ${{ matrix.dbal }}, PostgreSQL 17
        runs-on: ubuntu-latest
        container: php:${{ matrix.php }}-cli
        strategy:
            fail-fast: false
            matrix:
                include:
                    # DBAL 4 gives an AUTO id an identity column on PostgreSQL; DBAL 3 an ORM-managed sequence.
                    - php: '8.4'
                      symfony: '8.*'
                      dbal: '^4.0'
                    - php: '8.2'
                      symfony: '6.4.*'
                      dbal: '^3.6'
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: system_email_bundle_test
                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        env:
            COMPOSER_ALLOW_SUPERUSER: '1'
            SYMFONY_REQUIRE: ${{ matrix.symfony }}
            SYSTEM_EMAIL_TEST_DATABASE_URL: 'pgsql://postgres:postgres@postgres:5432/system_email_bundle_test?serverVersion=17&charset=utf8'
        steps:
            - uses: actions/checkout@v4

            - name: Install pdo_pgsql, Composer and Symfony Flex (pins Symfony through SYMFONY_REQUIRE)
              run: |
                  apt-get update -qq
                  apt-get install -y -qq git unzip libpq-dev
                  docker-php-ext-install pdo_pgsql
                  curl -fsSL https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
                  composer global config --no-plugins allow-plugins.symfony/flex true
                  composer global require --no-progress --no-scripts --no-plugins symfony/flex

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress --with "doctrine/dbal:${{ matrix.dbal }}"

            - name: Run PHPUnit
              run: vendor/bin/phpunit
