name: tests

on:
    push:
    pull_request:

jobs:
    phpunit:
        name: PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, SQLite
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.1'
                      symfony: '5.4.*'
                    - php: '8.2'
                      symfony: '6.4.*'
                    - php: '8.3'
                      symfony: '7.4.*'
                    - php: '8.4'
                      symfony: '8.*'
        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony }}
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo_sqlite
                  coverage: none

            - name: Install Symfony Flex (pins Symfony through SYMFONY_REQUIRE)
              run: |
                  composer global config --no-plugins allow-plugins.symfony/flex true
                  composer global require --no-progress --no-scripts --no-plugins symfony/flex

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            - name: Run PHPUnit
              run: vendor/bin/phpunit

    phpunit-mysql:
        name: PHP 8.4, Symfony 8.*, MySQL 8.4
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
                    MYSQL_DATABASE: system_email_bundle_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        env:
            SYMFONY_REQUIRE: '8.*'
            SYSTEM_EMAIL_TEST_DATABASE_URL: 'mysql://root@127.0.0.1:3306/system_email_bundle_test?serverVersion=8.4&charset=utf8mb4'
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_mysql
                  coverage: none

            - name: Install Symfony Flex (pins Symfony through SYMFONY_REQUIRE)
              run: |
                  composer global config --no-plugins allow-plugins.symfony/flex true
                  composer global require --no-progress --no-scripts --no-plugins symfony/flex

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            - name: Run PHPUnit
              run: vendor/bin/phpunit
